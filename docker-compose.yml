# Local Postgres for development and tests. The password comes from .env (git-ignored).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keyresult_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: keyresult
    ports:
      - "127.0.0.1:5433:5432" # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyresult_owner -d keyresult"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
